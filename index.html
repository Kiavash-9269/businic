<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Businic helps businesses grow through web design, software development, digital consulting and modern digital experiences."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0284c7" />

    <title>Businic | Digital Solutions for Modern Businesses</title>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ============================================================
         Preload local font — Gandom
         This is critical for LCP and CLS.
    ============================================================= -->
    <link
      rel="preload"
      href="/fonts/Gandom.woff"
      as="font"
      type="font/woff"
      crossorigin
    />

    <!-- Preload hero poster (LCP element on mobile) -->
    <link
      rel="preload"
      as="image"
      href="/hero-poster.png"
      type="image/png"
      fetchpriority="high"
    />

    <!-- ============================================================
         Open Graph / Twitter
    ============================================================= -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Businic" />
    <meta
      property="og:title"
      content="Businic | Digital Solutions for Modern Businesses"
    />
    <meta
      property="og:description"
      content="Web design, software development and digital consulting for growing businesses."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Businic | Digital Solutions for Modern Businesses"
    />
    <meta
      name="twitter:description"
      content="Web design, software development and digital consulting for growing businesses."
    />
    <meta name="twitter:image" content="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
